name: Archive visitor statistics and deploy

on:
  schedule:
    # 18:20 UTC Sunday = 02:20 Monday in Asia/Shanghai.
    # The collector fills every completed day since the previous weekly run.
    - cron: '20 18 * * 0'
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional first day to backfill (YYYY-MM-DD)
        required: false
        type: string
      end_date:
        description: Optional last day to backfill (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect completed daily aggregates
        env:
          SA_HOSTNAME: blog.trance-0.com
          SA_TIME_ZONE: Asia/Shanghai
          SA_START_DATE: ${{ inputs.start_date }}
          SA_END_DATE: ${{ inputs.end_date }}
          SIMPLE_ANALYTICS_API_KEY: ${{ secrets.SIMPLE_ANALYTICS_API_KEY }}
          SIMPLE_ANALYTICS_USER_ID: ${{ secrets.SIMPLE_ANALYTICS_USER_ID }}
        run: node scripts/collect-simple-analytics.mjs

      - name: Commit archive to main
        shell: bash
        run: |
          git add -- static/analytics/daily.json
          if git diff --cached --quiet; then
            echo "The aggregate archive is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Archive visitor statistics [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.157.0'
          extended: true

      - name: Validate post versions
        run: node scripts/validate-post-versions.mjs

      - name: Build
        run: |
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/write-life-seed.mjs
          hugo --minify --logLevel info
          test -d public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
